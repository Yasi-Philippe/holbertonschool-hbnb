<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB &#8211; Login</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="header-container">
            <a href="index.html" aria-label="HBnB home">
                <img src="logo.png" alt="HBnB" class="logo"
                     onerror="this.style.display='none';this.nextElementSibling.style.display='inline';">
                <span class="logo-fallback" style="display:none;">HBnB</span>
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="admin.html" id="admin-link" style="display:none;">Admin Panel</a>
                <a href="login.html" class="login-button">Login</a>
                <a href="#" id="logout-link" class="logout-button" style="display:none;">Logout</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="auth-container">
            <h1>Welcome back</h1>
            <p class="subtitle">Sign in to your account to continue</p>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email"
                           placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
                <p id="error-message" class="error-message" role="alert"></p>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 <strong>HBnB</strong>. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
